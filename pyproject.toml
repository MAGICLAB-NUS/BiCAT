[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "bicat"
version = "0.1.0"
description = "BiCAT bimanual action tokenizer and autoregressive VLA policy training"
readme = "README.md"
requires-python = ">=3.10,<3.14"
license = "Apache-2.0"
license-files = ["LICENSE"]
authors = [
    { name = "Chaoqi Liu" },
]
keywords = [
    "robotics",
    "imitation-learning",
    "vision-language-action",
    "action-tokenization",
    "robot-learning",
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Science/Research",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
dependencies = [
    # PyTorch
    "torch>=2.10.0,<2.11.0 ; sys_platform == 'linux' and platform_machine == 'aarch64'",
    "torch>=2.7.0,<2.8.0 ; sys_platform != 'linux' or platform_machine != 'aarch64'",
    "torchvision>=0.25.0,<0.26.0 ; sys_platform == 'linux' and platform_machine == 'aarch64'",
    "torchvision>=0.22.0,<0.23.0 ; sys_platform != 'linux' or platform_machine != 'aarch64'",

    # Hugging Face
    "lerobot==0.4.4",
    "datasets>=4.0.0",
    "huggingface-hub>=0.28.0",
    "diffusers>=0.27.0",
    "transformers>=4.57.6,<5",

    # Core
    "numpy>=1.26.0",
    "einops>=0.8.0",
    "pillow>=10.0.0",
    "safetensors>=0.4.0",
    "tqdm>=4.66.0",

    # Config
    "hydra-core>=1.3.0",
    "omegaconf>=2.3.0",

    # Serving integration
    "praxis-remote==0.1.1",
    "praxis-eval==0.1.2",
]

[project.optional-dependencies]
serving = [
    "grpcio>=1.78.0",
    "grpcio-tools>=1.78.0",
    "protobuf>=6.31.1",
]
logging = [
    "wandb>=0.16.0",
]
pali = [
    "peft",
]
molmo = [
    "peft",
]
all = [
    "bicat[serving]",
    "bicat[logging]",
    "bicat[pali]",
    "bicat[molmo]",
]

[project.scripts]
bicat-train = "bicat.scripts.train:main"
bicat-serve = "bicat.scripts.serve:main"

[project.urls]
Homepage = "https://chaoqi-liu.com/praxis-vla"
Source = "https://github.com/Chaoqi-LIU/praxis-vla"
Issues = "https://github.com/Chaoqi-LIU/praxis-vla/issues"
Documentation = "https://chaoqi-liu.com/praxis-vla"

[tool.uv.sources]
torch = [
    { index = "pytorch-cu126", marker = "sys_platform == 'linux' and platform_machine == 'aarch64'" },
]
torchvision = [
    { index = "pytorch-cu126", marker = "sys_platform == 'linux' and platform_machine == 'aarch64'" },
]

[[tool.uv.index]]
name = "pytorch-cu126"
url = "https://download.pytorch.org/whl/cu126"
explicit = true

# ---------------- Tool Configurations ----------------

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
bicat = [
    "configs/*.yaml",
    "configs/*/*.yaml",
    "configs/*/*/*.yaml",
    "configs/*/*/*/*.yaml",
]

[tool.ruff]
target-version = "py310"
line-length = 88

[tool.ruff.lint]
select = ["E", "W", "F", "I", "B", "C4", "UP", "SIM"]
ignore = ["E501"]

[tool.ruff.lint.isort]
combine-as-imports = true
known-first-party = ["bicat"]

[dependency-groups]
dev = [
    "basedpyright>=1.34.0",
    "ruff>=0.4.0",
]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"

[tool.basedpyright]
include = [
    "src/bicat",
    "scripts",
]
exclude = [
    "outputs",
    "wandb",
]
pythonVersion = "3.10"
typeCheckingMode = "basic"
reportMissingImports = "none"
reportMissingModuleSource = "none"
